<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedAI - Tibbiy Yordam</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0F172A; --accent: #2563EB; --bg: #F8FAFC; --error: #EF4444; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; }
        
        .header { background: white; padding: 1rem 2rem; border-bottom: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; }
        .hero { text-align: center; padding: 4rem 2rem; }
        .hero h1 { font-size: 2.5rem; color: var(--primary); }
        
        .btn-group { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; }
        .btn { padding: 1rem 2rem; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-chat { background: var(--primary); color: white; }
        .btn-quiz { background: var(--accent); color: white; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 600px; height: 70vh; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
        
        #messages { flex: 1; padding: 1rem; overflow-y: auto; background: #f1f5f9; }
        .input-area { padding: 1rem; display: flex; gap: 10px; border-top: 1px solid #eee; }
        .input-area input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }

        .emergency { position: fixed; bottom: 20px; right: 20px; background: var(--error); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: bold; box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight: 800; font-size: 1.5rem;">⚕️ MedAI</div>
</div>

<div class="hero">
    <h1>Tibbiy Savollaringizga <br> Aqlli Javoblar</h1>
    <p>Simptomlarni yozing yoki bilimingizni sinab ko'ring.</p>
    <div class="btn-group">
        <button class="btn btn-chat" onclick="openModal('chatModal')">Chatni Boshlash</button>
        <button class="btn btn-quiz" onclick="openModal('quizModal'); startQuiz();">Viktorina</button>
    </div>
</div>

<div id="chatModal" class="modal">
    <div class="modal-content">
        <div style="padding: 1rem; background: var(--primary); color: white; display: flex; justify-content: space-between;">
            <span>Chat</span>
            <button onclick="closeModal('chatModal')" style="color:white; background:none; border:none; cursor:pointer;">X</button>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Savol yozing...">
            <button onclick="sendChat()" class="btn btn-chat">Yuborish</button>
        </div>
    </div>
</div>

<div id="quizModal" class="modal">
    <div class="modal-content">
        <div style="padding: 1rem; background: var(--accent); color: white; display: flex; justify-content: space-between;">
            <span>Viktorina</span>
            <button onclick="closeModal('quizModal')" style="color:white; background:none; border:none; cursor:pointer;">X</button>
        </div>
        <div id="quizContent" style="padding: 2rem;"></div>
    </div>
</div>

<a href="tel:103" class="emergency">🚑 103</a>

<script>
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function sendChat() {
        const input = document.getElementById('userInput');
        const text = input.value;
        if(!text) return;
        
        const msgDiv = document.getElementById('messages');
        msgDiv.innerHTML += `<div><b>Siz:</b> ${text}</div>`;
        input.value = '';

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            msgDiv.innerHTML += `<div style="margin-top:10px;"><b>Bot:</b> ${data.reply}</div>`;
            msgDiv.scrollTop = msgDiv.scrollHeight;
        } catch(e) { alert("Xatolik!"); }
    }

    function startQuiz() {
        const content = document.getElementById('quizContent');
        content.innerHTML = `<h3>Sog'lom turmush tarzi haqida bilasizmi?</h3>
        <p>1. Kuniga necha litr suv ichish kerak?</p>
        <button class="btn" onclick="alert('To\\'g\\'ri!')">2 Litr</button>
        <button class="btn" onclick="alert('Noto\\'g\\'ri!')">0.5 Litr</button>`;
    }
</script>
</body>
</html>
